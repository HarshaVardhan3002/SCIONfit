name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"

      - name: lint
        run: ruff check src tests examples benchmarks
      - name: format
        run: ruff format --check src tests examples benchmarks
      - name: types
        run: mypy
      - name: import direction (core <- exposure <- front-ends)
        run: lint-imports
      - run: pytest -q

      - name: reference models must still be discriminated
        run: python -m scionarena.conformance.cli compare

      # A suite that passes everything measures nothing. The matrix has to
      # separate the four reference models or the probes are decorative.
      - name: the discrimination matrix must still discriminate
        run: pytest -q -k discriminate

      # Invariant 4. Two runs, two processes, one hash.
      - name: determinism
        run: pytest -q tests/test_trace.py

      # Any change to core/ runs the benchmark suite; beyond 15% on the
      # realistic tier fails. The baseline was recorded on a different machine
      # than this runner, so the suite times a fixed workload and scales the
      # comparison by it -- see the module docstring. If the runner turns out
      # to be too noisy for 15%, loosen it here with --tolerance rather than
      # deleting the step; a gate that never fires protects nothing.
      #
      # Pinned to the interpreter `benchmarks/baseline.json` was recorded on.
      # The benchmark runner also refuses to gate if numpy's major/minor differs
      # from the baseline metadata: machine speed divides out, dependency/runtime
      # behaviour shifts do not.
      - name: performance
        if: matrix.python == '3.11'
        run: python benchmarks/run.py
