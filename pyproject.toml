[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scionfit"
version = "0.1.0"
description = "Conformance and fit checking for SCION path-selection models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["scion", "path-aware networking", "benchmark", "conformance",
            "multipath", "machine learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
scionfit = "scionfit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scionfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "C408", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
