[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scionarena"
version = "0.1.0"
description = "A SCION network exposed to an AI recommendation node, and everything that happens"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["scion", "path-aware networking", "benchmark", "conformance",
            "multipath", "machine learning", "reinforcement learning", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
]
# core/ may depend on numpy and nothing else. A new dependency there needs an ADR.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy>=1.8", "import-linter>=2.0", "pre-commit"]
# Charts and the PDF. Deliberately not a runtime dependency: core/ keeps its
# numpy-only rule and the reporting stack must not become a substrate
# dependency (ADR 0018). Both are pure wheels on every platform we run on, and
# neither needs a browser or a GTK stack.
report = ["matplotlib>=3.8", "reportlab>=4.0"]
# The gradient-boosted reference model. Behind an extra for the same reason the
# report stack is: core/ keeps its numpy-only rule, and a benchmark that cannot
# be installed without a machine-learning toolkit is a benchmark most people
# will not install. Imported inside the model's own methods (ADR 0021 notes why
# its fit cost is the interesting part).
trees = ["scikit-learn>=1.4"]

[project.scripts]
scionarena = "scionarena.cli:main"
scionfit = "scionarena.conformance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scionarena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: runs at the stress tier; not gated on time, only on not falling over",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "C408", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.mypy]
# No python_version pin. Pinning it to 3.11 while running on a newer interpreter
# makes mypy parse that interpreter's installed stubs under 3.11 rules, and
# numpy's stubs use PEP 695 `type` statements -- so the whole check died on
# `numpy/__init__.pyi: Type statement is only supported in Python 3.12 and
# greater` before reaching any of our code. What keeps the source 3.11-compatible
# is the 3.11 leg of the CI matrix, which type-checks on a 3.11 interpreter, plus
# ruff's target-version above.
strict = true
# bench joins the strict list because it was written strict-clean and the
# result files it produces are the input to every number downstream. The
# rest of the tree stays best-effort, per CLAUDE.md.
files = ["src/scionarena/core", "src/scionarena/exposure", "src/scionarena/bench"]

# The reporting extra ships no type stubs, and neither library is on the
# substrate's dependency path: they are imported inside the functions that draw
# (ADR 0018), so an install without them still runs everything else.
[[tool.mypy.overrides]]
module = ["reportlab.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "scionarena"

# core <- exposure <- {conformance, bench, gym, agent, deploy}
# Front-ends are siblings: none of them may import another.
[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "scionarena.conformance : scionarena.bench : scionarena.gym : scionarena.agent : scionarena.deploy",
  "scionarena.exposure",
  "scionarena.instrument",
  "scionarena.core",
]

# Seam D: a model is written against the exposure layer and nothing else.
# reference/ stands in for every user model, so what it may not do, they may not do.
[[tool.importlinter.contracts]]
name = "Models never reach into the substrate"
type = "forbidden"
source_modules = ["scionarena.reference"]
forbidden_modules = ["scionarena.core", "scionarena.backends", "scionarena.conformance"]

# M2, ADR 0008. The module a model imports has no edge into the substrate at
# all -- which is why the agentic entry point takes a SessionLike protocol
# declared in contracts rather than the real Session, and why this contract is
# stronger than the one above rather than a restatement of it.
[[tool.importlinter.contracts]]
name = "The model-facing contract module reaches nothing"
type = "forbidden"
source_modules = ["scionarena.exposure.contracts"]
forbidden_modules = [
  "scionarena.core",
  "scionarena.exposure.session",
  "scionarena.exposure.tools",
  "scionarena.backends",
]

# Backends are deliberately absent from the layers contract until M1: the v0.1
# analytical world is written against the exposure contracts rather than against
# core, which is upside down. M1 rewrites it and it joins the contract then.
[[tool.importlinter.contracts]]
name = "Substrate depends on nothing above it"
type = "forbidden"
source_modules = ["scionarena.core"]
forbidden_modules = [
  "scionarena.exposure",
  "scionarena.backends",
  "scionarena.conformance",
  "scionarena.bench",
  "scionarena.gym",
  "scionarena.agent",
  "scionarena.deploy",
  "scionarena.instrument",
  "scionarena.reference",
]
